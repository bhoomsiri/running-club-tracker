[project]
name = "running-club-backend"
version = "0.1.0"
requires-python = ">=3.12"

# Only what this step needs. Web/storage/AI deps are added when the layer that
# uses them is built (FastAPI at the router step, boto3 at the storage step...).
dependencies = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
    "pyjwt[crypto]>=2.8",
    # Capped below 2.0 deliberately. In 1.x `Webhook.verify()` returns the parsed
    # payload; in 2.0 it returns None (it delegates to standardwebhooks with
    # json_parse=False), so the adapter would have bound `None` and every Clerk webhook
    # would have failed — silently, as new members quietly not existing. mypy caught it
    # in CI before the image was built. Lifting this cap means changing
    # adapters/auth/clerk_webhook.py to parse the payload itself, with the signature
    # tests run against 2.x.
    "svix>=1.20,<2",
    "slowapi>=0.1.9",
    "boto3>=1.34",
    "pillow>=10.3",
    # Capped below 3.0 deliberately, not out of caution about major versions in general.
    # 3.0.0 appeared on 9 Nov 2026 and broke the Monday CI run on a commit that had been
    # green the week before, without a line of our code changing — it depends on `httpx2`,
    # which starlette's TestClient then prefers over `httpx`, which changed the types the
    # test suite is checked against. That was only the visible half. The invisible half is
    # that this is a major version of the SDK that talks to Gemini, and `generate_content`
    # is how every submitted run gets read; nothing has tested our nine call sites in
    # `adapters/extraction/gemini_extractor.py` against it. With no lock file anywhere and
    # `pip install .` resolving afresh inside the Dockerfile, the next deploy of anything
    # at all would have carried it into production untested.
    #
    # The floor is 2.34 because that is what production is actually running and what CI
    # was last green with, so this pins the build back to a combination we have evidence
    # for rather than to a guess. Moving to 3.x is its own piece of work with its own
    # tests — not something to inherit from whatever PyPI served that morning.
    "google-genai>=2.34,<3",
    # The one xlsx writer that takes a Decimal and writes it as a number, without a
    # float in between (openpyxl.cell.cell.NUMERIC_TYPES includes Decimal). Golden rule
    # #6 is the reason this is the library and not one of the faster ones.
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "piexif>=1.1.3",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# extend-exclude, not exclude: `exclude` would replace ruff's defaults (.venv etc.)
extend-exclude = ["app/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = "app/alembic/"

# These ship no type information. Their call sites are wrapped by our own typed
# adapters, so the untyped surface stays behind a port.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "piexif.*", "slowapi.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real PostgreSQL (uses DATABASE_URL); skipped when absent",
]
