name: CI

on:
  pull_request:
  # Called by deploy.yml as its test gate, so main is tested by exactly one workflow
  # instead of two running the same suite side by side.
  workflow_call:
  # A weekly run on main, because the two triggers above only fire when somebody is
  # already working. Between 29 Aug and 1 Nov 2026 nothing was pushed to main, and in
  # that gap the MinIO service image was withdrawn from Docker Hub — this job had been
  # failing for seven weeks and the first anyone knew of it was opening an unrelated PR.
  # The things that break a green pipeline while you are not looking are not your code:
  # they are base images, registries and advisory databases.
  schedule:
    - cron: "17 2 * * 1" # Mondays, 02:17 UTC
  # So the weekly checks can be run on demand instead of waiting up to seven days.
  # Mainly for `bucket-is-private`: after touching the R2 bucket's permissions you
  # want the answer now, not next Monday.
  workflow_dispatch:

# Read-only by default; nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: club
          POSTGRES_PASSWORD: club
          POSTGRES_DB: running_club
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U club -d running_club"
          --health-interval 5s --health-timeout 3s --health-retries 10

      # LocalStack, not MinIO. `minio/minio` was withdrawn from Docker Hub — it resolves
      # for nobody now, tag or no tag — and this job sat broken for seven weeks because
      # nothing was pushed to main to notice (hence the schedule above).
      #
      # The replacements that look obvious are worse fits for a service container, which
      # can set an image and env but cannot pass a command: `quay.io/minio/minio` answers
      # 401, and Chainguard's build needs `server /data` as an argument.
      #
      # LocalStack over the lighter adobe/s3mock (223MB against 1.75GB, which is paid on
      # every run) for one reason, measured rather than assumed: **s3mock validates no
      # signatures at all.** A presigned URL minted for one key fetches a different key,
      # and an expired one keeps working. Two of the three storage tests in
      # test_s3_storage.py exist to catch exactly that, and on s3mock they fail — not
      # because the adapter is wrong, but because the server never checks. Paying 1.5GB
      # of pull time to keep those two tests meaningful is the better trade.
      #
      # S3_SKIP_SIGNATURE_VALIDATION=0 is what turns the checking on; LocalStack skips it
      # by default too. With it, an expired presigned URL and a wrong-key presigned URL
      # both come back 403, as they do from R2.
      s3:
        image: localstack/localstack:4.9
        env:
          SERVICES: s3
          S3_SKIP_SIGNATURE_VALIDATION: 0
        ports: ["4566:4566"]
        # The image ships its own healthcheck; this makes the job wait on it rather than
        # race the container, which the MinIO service never did — it only passed because
        # installing Python took longer than LocalStack takes to boot.
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30

    env:
      DATABASE_URL: postgresql+psycopg://club:club@localhost:5432/running_club
      S3_ENDPOINT_URL: http://localhost:4566
      # LocalStack accepts any key pair and checks the signature against whatever it is
      # given, which is all these tests need. boto3 refuses to sign without something.
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      # The same gate as the local one in CLAUDE.md — `tests` is type-checked too, so an
      # LSP break between a fake and a real repository fails here.
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy app tests
      - name: pytest
        run: pytest

      # Migrations run as their own step, never on app startup.
      - name: alembic upgrade head
        run: alembic upgrade head
      - name: alembic downgrade base (migration is reversible)
        run: alembic downgrade base

      - name: pip-audit
        run: pip install pip-audit && pip-audit

  # Supply chain: what the code depends on, what it accidentally carries, and how the
  # image is configured. Its own job so it runs beside the test suite rather than after
  # it — a dependency CVE and a failing test are independent facts, and waiting five
  # minutes to learn the second one is wasted time.
  #
  # pip-audit above still runs: it reads the resolved Python environment, while Trivy
  # reads lockfiles across both halves of the repo. The overlap is deliberate.
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to publish the SARIF into the Security tab

    steps:
      - uses: actions/checkout@v4

      # Pinned to a release, never @master: a scanner that runs on every push with
      # write access to the Security tab is exactly the action you do not want silently
      # updating itself.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          # vuln: dependencies with known CVEs. secret: a key committed by accident.
          # misconfig: the Dockerfile and compose file (root user, missing healthcheck).
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          # A CVE with no released fix cannot be acted on, and a gate that cannot be
          # satisfied is one people learn to skip. They still reach the Security tab.
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: sarif
          output: trivy-fs.sarif
          # Not optional, despite looking like a detail. With format=sarif the action
          # unsets --severity so the report carries every level — which also means
          # exit-code stops applying to HIGH,CRITICAL and starts applying to anything at
          # all. This repo has one LOW finding (DS-0026, no HEALTHCHECK in the
          # Dockerfile: Cloud Run uses its own probes, so adding one to please a scanner
          # would be cargo cult), and without this line that LOW would fail the build.
          limit-severities-for-sarif: true

      # always(): a failing scan is precisely when the findings need to be readable
      # somewhere other than a log that scrolls past.
      - name: Publish the findings
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # The check we believed we had for months and did not.
  #
  # test_s3_storage.py used to assert that an unsigned GET to the evidence bucket is
  # refused, and it asserted that against MinIO's defaults — a local stand-in, never
  # against R2. The thing being tested was the bucket's configuration, which is not
  # something any mock can speak for: both s3mock and LocalStack serve unsigned reads
  # happily. So the assertion was comfort, not coverage, and it would have stayed green
  # through a bucket accidentally made public.
  #
  # This asks the real bucket. No credentials: an unsigned request is the whole point, so
  # there is nothing to leak and nothing to rotate. What counts as a refusal is decided
  # inside the step, and the note there is worth reading before changing any of it.
  #
  # Never on a PR, deliberately — it reaches outside the repo, and a PR must not go red
  # because Cloudflare had a bad minute. Weekly, plus on demand via workflow_dispatch.
  bucket-is-private:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: An unsigned read of production evidence must be refused
        env:
          # A full URL to any object path in the evidence bucket. The object need not
          # exist — see the note below on why a missing object is the interesting case.
          #
          # Read from either place. It carries no credential — the request is unsigned
          # by design, so there is nothing in it to authenticate with — but the URL does
          # name the R2 account and bucket, so holding it as a secret is reasonable and
          # has one small benefit: Actions will mask it if a future change ever echoes
          # it into a log. A repository variable works just as well, and accepting both
          # means the job does not sit there silently un-run because the value went into
          # the other box. Which is exactly what happened the first time.
          PROBE_URL: ${{ secrets.R2_PROBE_URL || vars.R2_PROBE_URL }}
        run: |
          if [ -z "$PROBE_URL" ]; then
            echo "::error::R2_PROBE_URL is not set, so nothing was checked."
            echo "Set it as either a repository secret or a repository variable, to an"
            echo "object URL in the production evidence bucket, e.g."
            echo "  https://<account>.r2.cloudflarestorage.com/running-club-evidence/probe"
            exit 1
          fi

          # READ THIS BEFORE SIMPLIFYING THIS STEP.
          #
          # The obvious version of this check asserts `HTTP 403`, and it is wrong.
          # R2 is S3-compatible in its API, not in its error mapping: an unsigned GET
          # comes back as
          #
          #     HTTP 400
          #     <Error><Code>InvalidArgument</Code>
          #            <Message>Invalid Argument: Authorization</Message></Error>
          #
          # not the 403 AccessDenied that S3 itself would send. The first version of
          # this job asserted 401/403 and would have failed on a bucket that is
          # correctly closed — the worst kind of failure, because it reads as "the
          # bucket is public" and the natural fix is to relax the assertion until it
          # passes, at which point the job proves nothing.
          #
          # So the verdict comes from the MEANING of the refusal, not its number:
          #
          #   pass — refused on authorization grounds, however it is spelled.
          #   fail — HTTP 200: the object was served to a request carrying no signature.
          #   fail — NoSuchKey: worse than it looks. It means R2 went and checked
          #          whether the key exists and told us, which it only does once the
          #          caller is authorised. Answering a question about our objects'
          #          existence to an anonymous caller is the leak, even though no
          #          image came back. This is why the probe URL may point at a key
          #          that does not exist: a closed bucket refuses before it looks,
          #          so "not found" and "forbidden" distinguish the two states.
          #   fail — anything else, loudly. An answer we do not recognise is not
          #          evidence of privacy, and silence here is how a real regression
          #          would slip past.
          #
          # If this starts failing after a Cloudflare change, read the printed Code
          # and Message and decide which of the three buckets above it belongs in.
          # Do not widen the pass list to make the build green.
          body="$RUNNER_TEMP/r2-probe.xml"
          status=$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' "$PROBE_URL" || echo 000)
          code=$(tr -d '\n' < "$body" | sed -n 's#.*<Code>\([^<]*\)</Code>.*#\1#p')
          message=$(tr -d '\n' < "$body" | sed -n 's#.*<Message>\([^<]*\)</Message>.*#\1#p')
          echo "unsigned GET -> HTTP $status  Code=${code:-<none>}  Message=${message:-<none>}"

          if [ "$status" = "000" ]; then
            echo "::error::Could not reach the bucket at all, so privacy was not tested."
            exit 1
          fi

          if [ "$status" = "200" ]; then
            echo "::error::The evidence bucket served an object to an UNSIGNED request."
            exit 1
          fi

          case "$code" in
            AccessDenied | Unauthorized | AuthorizationHeaderMalformed)
              echo "Refused on authorization grounds ($code). Bucket is closed."
              ;;
            InvalidArgument)
              # R2's spelling. Only counts when the argument it objected to is the
              # authorization itself — `InvalidArgument` about anything else (a bad
              # query parameter, a malformed probe URL) says nothing about access.
              case "$message" in
                *Authorization* | *authorization*)
                  echo "Refused on authorization grounds ($code: $message). Bucket is closed."
                  ;;
                *)
                  echo "::error::InvalidArgument, but not about authorization: $message"
                  echo "The probe URL is probably malformed, so nothing was tested."
                  exit 1
                  ;;
              esac
              ;;
            NoSuchKey | NoSuchBucket)
              echo "::error::The bucket answered a question about whether our objects exist"
              echo "($code) without asking for a signature. It is readable anonymously."
              exit 1
              ;;
            *)
              echo "::error::Unrecognised answer: HTTP $status, Code=${code:-<none>}."
              echo "This is not proof the bucket is private. Read the note in this step"
              echo "before changing the assertion."
              exit 1
              ;;
          esac
