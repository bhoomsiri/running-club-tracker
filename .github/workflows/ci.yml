name: CI

on:
  pull_request:
  # Called by deploy.yml as its test gate, so main is tested by exactly one workflow
  # instead of two running the same suite side by side.
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: club
          POSTGRES_PASSWORD: club
          POSTGRES_DB: running_club
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U club -d running_club"
          --health-interval 5s --health-timeout 3s --health-retries 10

      minio:
        image: minio/minio:edge-cicd
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]

    env:
      DATABASE_URL: postgresql+psycopg://club:club@localhost:5432/running_club
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      # The same gate as the local one in CLAUDE.md — `tests` is type-checked too, so an
      # LSP break between a fake and a real repository fails here.
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy app tests
      - name: pytest
        run: pytest

      # Migrations run as their own step, never on app startup.
      - name: alembic upgrade head
        run: alembic upgrade head
      - name: alembic downgrade base (migration is reversible)
        run: alembic downgrade base

      - name: pip-audit
        run: pip install pip-audit && pip-audit

  # Supply chain: what the code depends on, what it accidentally carries, and how the
  # image is configured. Its own job so it runs beside the test suite rather than after
  # it — a dependency CVE and a failing test are independent facts, and waiting five
  # minutes to learn the second one is wasted time.
  #
  # pip-audit above still runs: it reads the resolved Python environment, while Trivy
  # reads lockfiles across both halves of the repo. The overlap is deliberate.
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to publish the SARIF into the Security tab

    steps:
      - uses: actions/checkout@v4

      # Pinned to a release, never @master: a scanner that runs on every push with
      # write access to the Security tab is exactly the action you do not want silently
      # updating itself.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          # vuln: dependencies with known CVEs. secret: a key committed by accident.
          # misconfig: the Dockerfile and compose file (root user, missing healthcheck).
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          # A CVE with no released fix cannot be acted on, and a gate that cannot be
          # satisfied is one people learn to skip. They still reach the Security tab.
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: sarif
          output: trivy-fs.sarif
          # Not optional, despite looking like a detail. With format=sarif the action
          # unsets --severity so the report carries every level — which also means
          # exit-code stops applying to HIGH,CRITICAL and starts applying to anything at
          # all. This repo has one LOW finding (DS-0026, no HEALTHCHECK in the
          # Dockerfile: Cloud Run uses its own probes, so adding one to please a scanner
          # would be cargo cult), and without this line that LOW would fail the build.
          limit-severities-for-sarif: true

      # always(): a failing scan is precisely when the findings need to be readable
      # somewhere other than a log that scrolls past.
      - name: Publish the findings
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
