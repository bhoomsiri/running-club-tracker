name: Deploy

# Production deploys, triggered by a push to main. The order is deliberate:
#   test gate  →  build + push image  →  deploy Cloud Run  →  alembic upgrade head
# Nothing reaches production that has not passed ruff, mypy and pytest first.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping runs could push images in one order and reach
# `gcloud run deploy` in the other, leaving production on the older commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: asia-southeast1 # Singapore: nearest region, and comfortable for PDPA residency
  SERVICE: running-club-api
  REPOSITORY: running-club # Artifact Registry repository

jobs:
  # The same gate CI runs on pull requests, called rather than copied so the two can
  # never drift apart.
  test:
    uses: ./.github/workflows/ci.yml
    # A called workflow cannot grant itself more than the caller has, and its
    # supply-chain job publishes a SARIF report. Without this the scan runs and the
    # upload 403s on main while passing on pull requests — the confusing half-failure.
    permissions:
      contents: read
      security-events: write

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mints the OIDC token for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      # Keyless: GitHub proves its identity to Google directly. No service-account JSON
      # key exists to be committed, copied or leaked.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build the image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          BASE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE"
          # Tagged with the commit sha, so what is running is always traceable back to
          # a commit — and a rollback is `gcloud run deploy --image ...:<old sha>`.
          docker build -t "$BASE:${{ github.sha }}" -t "$BASE:latest" backend
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "IMAGE=$BASE:${{ github.sha }}" >> "$GITHUB_ENV"

      # Between build and push, deliberately. The image exists only in this runner's
      # docker daemon at this point, so a CRITICAL finding stops here: nothing reaches
      # Artifact Registry, nothing reaches Cloud Run, and there is no bad tag to clean
      # up afterwards. Scanning the built image rather than the repository is what
      # catches the other half — the CVEs that come from the base image and the system
      # packages in it, which no lockfile mentions.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH
          # Base-image CVEs with no upstream fix would otherwise block every deploy
          # until Debian ships a patch, which is not a decision this gate should make.
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Push the image
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          docker push "$BASE:latest"

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          # Two kinds of configuration, handled differently.
          #
          # The six values below are secrets, and they live in Secret Manager. What
          # travels here is a NAME, never a value: `database-url:latest` is a reference
          # Cloud Run resolves for itself, so nothing sensitive passes through this
          # workflow, its log, or the service's plaintext environment. Rotating one means
          # adding a new version of that secret — no code change and no commit.
          #
          # Everything else (CLERK_ISSUER, the URLs, APP_ENV, TRUST_PROXY...) is not
          # secret and stays configured once on the service itself, which is why there is
          # still no --set-env-vars: gcloud updates only the fields named here and leaves
          # the rest alone.
          #
          # --set-secrets REPLACES the whole set — "all existing secrets will be removed
          # first", per gcloud. A seventh secret therefore goes in this list; adding it
          # anywhere else silently unmounts these six.
          #
          # --remove-env-vars is what makes the switch one-way. It strips the old
          # plaintext copies in the SAME revision that mounts the secret versions, so no
          # revision ever exists holding both, and rolling back to a revision that still
          # has the plaintext is a deliberate act rather than an accident.
          #
          # --allow-unauthenticated because Cloudflare, not IAM, is the front door; what
          # keeps the raw *.run.app URL shut is the CF_ORIGIN_SECRET guard in the app.
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --min-instances 1 \
            --max-instances 4 \
            --concurrency 40 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 60s \
            --allow-unauthenticated \
            --set-secrets=DATABASE_URL=database-url:latest,CF_ORIGIN_SECRET=cf-origin-secret:latest,CLERK_WEBHOOK_SECRET=clerk-webhook-secret:latest,S3_ACCESS_KEY=s3-access-key:latest,S3_SECRET_KEY=s3-secret-key:latest,GEMINI_API_KEY=gemini-api-key:latest \
            --remove-env-vars=DATABASE_URL,CF_ORIGIN_SECRET,CLERK_WEBHOOK_SECRET,S3_ACCESS_KEY,S3_SECRET_KEY,GEMINI_API_KEY \
            --quiet

      - name: Show the deployed revision
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" \
            --format 'value(status.latestReadyRevisionName,status.url)'

  # A separate job, never part of application startup: Cloud Run runs several instances
  # and they would race each other on the schema.
  #
  # This runs AFTER the deploy, as specified. That is safe for additive migrations, but
  # it does mean a migration the new code *requires* is missing for the few seconds in
  # between. Keep schema changes expand-then-contract (add the new column in one release,
  # stop using the old one in a later release) and that window costs nothing. For a
  # change that cannot be expressed additively, move this job before `deploy` for that
  # release.
  migrate:
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: alembic upgrade head
        env:
          # The Neon connection string, from GitHub Secrets. Deliberately NOT the Secret
          # Manager copy the service now uses: alembic runs on a GitHub runner, which is
          # not the Cloud Run service and has no runtime service account to read Secret
          # Manager with. Two stores holding the same string is the cost of that; rotate
          # the database password and BOTH have to be updated.
          #
          # If Neon's IP allow-list is enabled it has to permit GitHub's runners, whose
          # addresses are not fixed.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head
